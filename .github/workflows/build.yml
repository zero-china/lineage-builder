name: Build LineageOS 18.1 for Samsung S9+ (star2qltechn)

on:
  workflow_dispatch:
    inputs:
      build_stage:
        description: '请选择编译阶段'
        required: true
        type: choice
        default: '第 2 次运行 (全量冲刺 100% 打包出 ROM)'
        options:
          - '第 1 次运行 (编到 55% 自动安全刹车并存缓存)'
          - '第 2 次运行 (全量冲刺 100% 打包出 ROM)'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Generate Timestamp
        id: timestamp
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Deep Cleanup Disk Space & Setup 12G Swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/aws*
          sudo rm -rf /var/lib/docker
          sudo rm -rf /var/lib/containerd
          sudo rm -rf /usr/lib/llvm-*
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives/*
          sudo fallocate -l 12G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== 磁盘清理后状态 ==="
          df -h

      - name: Install Build Tools & Dependencies
        run: |
          sudo apt update
          sudo apt install -y git-lfs flex bison build-essential curl libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev python3 ccache libncurses5 libtinfo5
          git lfs install
          sudo curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo

      # ==========================================
      # 1. 恢复 Ccache（纯绝对路径，精准命中 4.97GB）
      # ==========================================
      - name: Restore Ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ runner.os }}-lineage18-${{ steps.timestamp.outputs.ts }}
          restore-keys: |
            ccache-${{ runner.os }}-lineage18-

      - name: Verify Ccache Directory
        run: |
          mkdir -p /home/runner/.cache/ccache
          export CCACHE_DIR=/home/runner/.cache/ccache
          ccache -M 5G
          echo "=== 校验恢复后的 Ccache 状态 ==="
          ccache -s

      - name: Initialize Repo & Manifests
        run: |
          mkdir -p /home/runner/lineage && cd /home/runner/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --no-clone-bundle --git-lfs --depth=1 -g default,-darwin
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/roomservice.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Device Trees -->
            <project name="matebuteler/android_device_samsung_star2qltechn" path="device/samsung/star2qltechn" remote="github" revision="lineage-18.1" />
            <project name="matebuteler/android_device_samsung_sdm845-common" path="device/samsung/sdm845-common" remote="github" revision="lineage-18.1" />

            <!-- Kernel -->
            <project name="klabit87/android_kernel_samsung_sdm845" path="kernel/samsung/sdm845" remote="github" revision="lineage-18.0" />

            <!-- Vendor Blobs -->
            <project name="DotOS-Devices/proprietary_vendor_samsung_sdm845-common" path="vendor/samsung/sdm845-common" remote="github" revision="dot11" />

            <!-- Hardware Samsung -->
            <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="lineage-18.1" />
          </manifest>
          EOF
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j8 --force-sync

      # ==========================================
      # 补丁 1：补充 samsung_touch.h 头文件依赖
      # ==========================================
      - name: Fix Samsung Hardware Missing Headers
        run: |
          cd /home/runner/lineage
          echo "🔧 正在补充 samsung_touch.h 头文件依赖..."
          mkdir -p hardware/samsung/hidl/touch
          mkdir -p hardware/samsung/include
          cp -rf device/samsung/sdm845-common/include/* hardware/samsung/hidl/touch/ 2>/dev/null || true
          cp -rf device/samsung/sdm845-common/include/* hardware/samsung/include/ 2>/dev/null || true
          echo "✅ 头文件补全完毕！"

      # ==========================================
      # 补丁 2：USB VID 白名单补丁
      # ==========================================
      - name: Apply USB VID Whitelist Patch
        run: |
          cd /home/runner/lineage
          python3 -c '
          import re
          path = "frameworks/base/services/usb/java/com/android/server/usb/UsbHostManager.java"
          with open(path, "r") as f:
              content = f.read()

          old_code = """    public void getDeviceList(Bundle devices) {
              synchronized (mLock) {
                  for (String name : mDevices.keySet()) {
                      devices.putParcelable(name, mDevices.get(name));
                  }
              }
          }"""

          new_code = """    public void getDeviceList(Bundle devices) {
              synchronized (mLock) {
                  int callingUid = Binder.getCallingUid();
                  String[] packages = mContext.getPackageManager().getPackagesForUid(callingUid);

                  boolean isWhitelisted = false;
                  if (packages != null) {
                      for (String pkg : packages) {
                          if ("com.junkfood.seal".equals(pkg) || "com.zerodogs.min".equals(pkg)) {
                              isWhitelisted = true;
                              break;
                          }
                      }
                  }

                  for (String name : mDevices.keySet()) {
                      UsbDevice device = mDevices.get(name);
                      if (device != null && device.getVendorId() == 0x0000 && !isWhitelisted) {
                          continue;
                      }
                      devices.putParcelable(name, device);
                  }
              }
          }"""

          if old_code in content:
              content = content.replace(old_code, new_code)
              with open(path, "w") as f:
                  f.write(content)
              print("✅ 白名单代码补丁成功应用！")
          elif re.search(r"public void getDeviceList\(Bundle devices\) \{[\s\S]*?\}\n    \}", content):
              content = re.sub(r"public void getDeviceList\(Bundle devices\) \{[\s\S]*?\}\n    \}", new_code.strip(), content)
              with open(path, "w") as f:
                  f.write(content)
              print("✅ 正则匹配成功，白名单补丁已打入！")
          else:
              print("⚠️ 未匹配到方法")
          '

      # ==========================================
      # 补丁 3：InputReader 虚拟键盘全键生效补丁 (VID:0x0000 PID:0x0000)
      # ==========================================
      - name: Apply InputReader Virtual Keyboard All-Keys Patch
        run: |
          cd /home/runner/lineage
          python3 -c '
          import os, re

          candidates = [
              "frameworks/native/services/inputflinger/reader/mapper/KeyboardInputMapper.cpp",
              "frameworks/native/services/inputflinger/InputReader.cpp"
          ]

          target_file = None
          for p in candidates:
              if os.path.exists(p):
                  target_file = p
                  break

          if not target_file:
              print("⚠️ 未找到 KeyboardInputMapper 源码文件，跳过")
              exit(0)

          with open(target_file, "r") as f:
              content = f.read()

          patch_logic = """
              // [CUSTOM PATCH] 针对 0x0000:0x0000 键盘设备，所有按键均重置为 Virtual 虚拟设备
              int32_t finalDeviceId = getDeviceId();
              const auto& _ident = getDeviceContext().getDeviceIdentifier();
              if (_ident.vendor == 0x0000 && _ident.product == 0x0000) {
                  finalDeviceId = -1; // ReservedInputDeviceId::VIRTUAL_KEYBOARD_ID
              }
          """

          if "NotifyKeyArgs args(" in content:
              content = content.replace("getDeviceId()", "finalDeviceId")
              pattern = r"(void\s+KeyboardInputMapper::processKey\s*\([^)]*\)\s*\{)"
              content = re.sub(pattern, r"\1" + patch_logic, content, count=1)
              with open(target_file, "w") as f:
                  f.write(content)
              print(f"✅ 虚拟键盘全按键 Hook 补丁精准注入成功: {target_file}")
          else:
              print("⚠️ 未匹配到 NotifyKeyArgs 调用点")
          '

      # ==========================================
      # 3. 智能接力编译 (干净无后台干扰)
      # ==========================================
      - name: Clean .repo & Build ROM with Ccache
        id: build_rom
        timeout-minutes: 300
        env:
          BUILD_STAGE: ${{ inputs.build_stage }}
        run: |
          cd /home/runner/lineage
          rm -rf .repo
          echo "=== 删掉 .repo 后的磁盘空间 ==="
          df -h

          # Ccache 极致命中率配置 (上限显式设为 5G)
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=/home/runner/.cache/ccache
          export CCACHE_BASEDIR=/home/runner/lineage
          export CCACHE_NOHASHDIR=1
          export CCACHE_COMPILERCHECK=content
          export CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros,file_macro
          ccache -M 5G
          export NINJA_ARGS="-j4"
          export SOURCE_DATE_EPOCH=1666051200

          source build/envsetup.sh
          lunch lineage_star2qltechn-userdebug
          export SOONG_MAX_LINK_JOBS=1

          # 🔧 在编译前最后一秒二次确认头文件依赖，确保不被 Wipe 抹除
          mkdir -p hardware/samsung/hidl/touch hardware/samsung/include
          cp -rf device/samsung/sdm845-common/include/* hardware/samsung/hidl/touch/ 2>/dev/null || true
          cp -rf device/samsung/sdm845-common/include/* hardware/samsung/include/ 2>/dev/null || true

          echo "🚀 当前任务模式: $BUILD_STAGE"

          # 阶段一：第1次运行
          if [[ "$BUILD_STAGE" == *"第 1 次"* ]]; then
            mka bacon 2>&1 | python3 -c '
          import sys, re, subprocess
          target_pct = 55
          min_total_tasks = 80000
          last_pct = -1
          for line in sys.stdin:
              m = re.search(r"\[\s*(\d+)%\s+(\d+)/(\d+)\]", line)
              if m:
                  pct, current, total = int(m.group(1)), int(m.group(2)), int(m.group(3))
                  if pct != last_pct:
                      print(f"🚀 编译进度: {pct}% ({current}/{total})", flush=True)
                      last_pct = pct
                  if total >= min_total_tasks and pct >= target_pct:
                      print(f"\n🎉 [第 1 次接力完成] 全量任务已达 {pct}%！安全停止并保存 Ccache 缓存...", flush=True)
                      subprocess.run(["pkill", "-TERM", "-f", "ninja"], check=False)
                      subprocess.run(["pkill", "-TERM", "-f", "mka"], check=False)
                      sys.exit(0)
              elif "FAILED" in line or "error:" in line or "Completed" in line:
                  print(line, end="", flush=True)
            ' || true

          # 阶段二：第2次运行
          else
            mka bacon 2>&1 | python3 -c '
          import sys, re
          last_pct = -1
          for line in sys.stdin:
              m = re.search(r"\[\s*(\d+)%\s+(\d+)/(\d+)\]", line)
              if m:
                  pct, current, total = int(m.group(1)), int(m.group(2)), int(m.group(3))
                  if pct != last_pct:
                      print(f"🚀 编译进度: {pct}% ({current}/{total})", flush=True)
                      last_pct = pct
              elif "FAILED" in line or "error:" in line or "Completed" in line:
                  print(line, end="", flush=True)
            '
          fi

      # ==========================================
      # 4. 保存 Ccache 缓存
      # ==========================================
      - name: Save Ccache (Always on Success, Failure, Timeout, or Cancel)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ runner.os }}-lineage18-${{ steps.timestamp.outputs.ts }}

      - name: Show Ccache Stats & Disk Info
        if: always()
        run: |
          export CCACHE_DIR=/home/runner/.cache/ccache
          echo "=== Ccache 缓存命中与占用统计 ==="
          ccache -s || true
          echo "=== 当前磁盘剩余空间 ==="
          df -h

      # ==========================================
      # 5. 上传最终产物
      # ==========================================
      - name: Upload ROM & Flashable Images
        if: success() && contains(inputs.build_stage, '第 2 次')
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-18.1-star2qltechn-Package
          path: |
            /home/runner/lineage/out/target/product/star2qltechn/lineage-18.1-*.zip
            /home/runner/lineage/out/target/product/star2qltechn/boot.img
            /home/runner/lineage/out/target/product/star2qltechn/recovery.img

name: Build LineageOS 18.1 for Samsung S9+

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space & Setup Environment
        run: |
          echo "=== 1. 清理 Runner 无用软件包与镜像 ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/doc /opt/hostedtoolcache
          sudo apt-get purge -y ghc* zulu* php* firefox google-chrome* azure-cli* microsoft-edge* powershell* mongodb* mysql* azure-cli* || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          
          echo "=== 2. 创建 16GB 高性能 Swap (彻底解决 OOM) ==="
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

          echo "=== 3. 安装 AOSP 依赖工具链 ==="
          sudo apt-get update
          sudo apt-get install -y bc bisect build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblibc6-dev-i386 libncurses5 libncurses5-dev libreadline-dev libsqlite3-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 zstd

          echo "=== 4. 配置 Repo 工具 ==="
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

          echo "=== 5. 创建 Ccache 目录 (严格统一步骤路径) ==="
          mkdir -p /home/runner/.cache/ccache

      # ----------------------------------------------------
      # Ccache 恢复步骤 (只对 /home/runner/.cache/ccache 生效)
      # ----------------------------------------------------
      - name: Restore Ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-Linux-lineage18-${{ github.run_id }}
          restore-keys: |
            ccache-Linux-lineage18-

      - name: Sync LineageOS Source & Apply Custom Patches
        run: |
          mkdir -p /home/runner/lineage
          cd /home/runner/lineage

          echo "=== 配置 Git ==="
          git config --global user.name "Runner"
          git config --global user.email "runner@github.com"

          echo "=== Repo Init ==="
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --git-lfs --depth=1

          echo "=== Sync Local Manifests ==="
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/star2qltechn.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="LineageOS/android_device_samsung_star2qltechn" path="device/samsung/star2qltechn" remote="github" revision="lineage-18.1" />
            <project name="LineageOS/android_device_samsung_sdm845-common" path="device/samsung/sdm845-common" remote="github" revision="lineage-18.1" />
            <project name="LineageOS/android_kernel_samsung_sdm845" path="kernel/samsung/sdm845" remote="github" revision="lineage-18.1" />
            <project name="The-Muppets/proprietary_vendor_samsung" path="vendor/samsung" remote="github" revision="lineage-18.1" />
            <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="lineage-18.1" />
          </manifest>
          EOF

          echo "=== Repo Sync (4并发，稳定防断) ==="
          ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

          echo "=== 清理 .repo 隐藏目录吐出 25GB+ 空间 ==="
          rm -rf .repo

          echo "=== 应用 Patch 1: Samsung Touch 头文件补丁 ==="
          if [ -d "device/samsung/sdm845-common/include" ] && [ -d "hardware/samsung/hidl/touch" ]; then
              cp -f device/samsung/sdm845-common/include/*.h hardware/samsung/hidl/touch/ || true
              echo "✅ Samsung touch headers 拷贝完成！"
          fi

          echo "=== 应用 Patch 2: UsbHostManager VID/PID 白名单补丁 ==="
          python3 -c '
          import os, re
          path = "frameworks/base/services/usb/java/com/android/server/usb/UsbHostManager.java"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "com.junkfood.seal" not in content:
                  target = "private boolean isBlackListed(int vendorID, int productID) {"
                  replacement = """private boolean isBlackListed(int vendorID, int productID) {
              if (vendorID == 0x0000) {
                  String[] allowedPackages = {"com.junkfood.seal", "com.zerodogs.min"};
                  for (String pkg : allowedPackages) {
                      if (isCallerInPackage(pkg)) return false;
                  }
              }"""
                  content = content.replace(target, replacement)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("✅ UsbHostManager 补丁写入成功！")
          '

          echo "=== 应用 Patch 3: KeyboardInputMapper 虚拟键盘补丁 ==="
          python3 -c '
          import os, re
          path = "frameworks/native/services/inputflinger/reader/mapper/KeyboardInputMapper.cpp"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "VIRTUAL_KEYBOARD_ID" not in content:
                  target = re.search(r"NotifyKeyArgs args\(.*?\);", content, re.DOTALL)
                  if target:
                      old_code = target.group(0)
                      new_code = """int32_t finalDeviceId = deviceId;
              if (getDeviceContext().getIdentifier().vendor == 0x0000 && getDeviceContext().getIdentifier().product == 0x0000) {
                  finalDeviceId = -1; // VIRTUAL_KEYBOARD_ID
              }
              """ + old_code.replace("deviceId,", "finalDeviceId,")
                      content = content.replace(old_code, new_code)
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
                      print("✅ KeyboardInputMapper 虚拟键盘补丁写入成功！")
          '

      - name: Compile LineageOS ROM
        run: |
          cd /home/runner/lineage

          echo "=== 1. 配置 Ccache 强力缓存参数 ==="
          export CCACHE_DIR=/home/runner/.cache/ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_BASEDIR=/home/runner/lineage
          export CCACHE_NOHASHDIR=1
          export CCACHE_COMPILERCHECK=content
          export CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros,file_macro
          ccache -M 8G
          ccache -z

          echo "=== 2. 启动 35GB 高位安全防竞争空间守护进程 ==="
          cat << 'PYEOF' > /tmp/disk_cleaner.py
          import os, time, shutil

          OUT_DIR = "/home/runner/lineage/out/target/product/star2qltechn"
          KERNEL_OBJ = os.path.join(OUT_DIR, "obj/KERNEL_OBJ")
          SYMBOLS_DIR = os.path.join(OUT_DIR, "symbols")

          print("🛡️ [DiskCleaner] 35GB高位防竞争守护进程已启动...", flush=True)

          while True:
              time.sleep(30)
              try:
                  # 1. 随产随清 symbols 调试符号 (不留隐患，大头优先干掉)
                  if os.path.exists(SYMBOLS_DIR):
                      for item in os.listdir(SYMBOLS_DIR):
                          p = os.path.join(SYMBOLS_DIR, item)
                          try:
                              if os.path.isdir(p): shutil.rmtree(p, ignore_errors=True)
                              else: os.remove(p)
                          except: pass

                  # 2. 检查空间，低于 35GB 立刻触发回收
                  st = os.statvfs("/")
                  avail_gb = (st.f_bavail * st.f_frsize) / (1024 * 1024 * 1024)
                  now = time.time()

                  if avail_gb < 35.0:
                      print(f"\n[DiskCleaner] ⚠️ 磁盘可用空间仅剩 {avail_gb:.1f}GB < 35GB，启动高位回收...", flush=True)

                      if os.path.exists(OUT_DIR):
                          for root, dirs, files in os.walk(OUT_DIR):
                              for f in files:
                                  if f.endswith(('.o.cmd', '.d', '.cmd')):
                                      fp = os.path.join(root, f)
                                      try:
                                          # 关键防竞争：只删生成超过 60 秒的旧文件
                                          if now - os.path.getmtime(fp) > 60:
                                              os.remove(fp)
                                      except: pass

                      vmlinux_path = os.path.join(KERNEL_OBJ, "vmlinux")
                      if os.path.exists(vmlinux_path):
                          for root, dirs, files in os.walk(KERNEL_OBJ):
                              for f in files:
                                  if f.endswith('.o') and not f.startswith('Image'):
                                      fp = os.path.join(root, f)
                                      try:
                                          if now - os.path.getmtime(fp) > 60:
                                              os.remove(fp)
                                      except: pass

                      print("[DiskCleaner] ✅ 空间回收完成！", flush=True)
              except Exception as e:
                  pass
          PYEOF
          python3 /tmp/disk_cleaner.py &
          CLEANER_PID=$!

          echo "=== 3. 环境变量与防 OOM 并发控制 ==="
          source build/envsetup.sh
          breakfast star2qltechn
          export SOONG_MAX_LINK_JOBS=1

          echo "=== 4. 开始最终编译 (mka bacon) ==="
          mka bacon || {
              echo "❌ 编译终止！清理守护进程 PID: $CLEANER_PID"
              kill -9 $CLEANER_PID || true
              exit 1
          }

          kill -9 $CLEANER_PID || true
          echo "=== Ccache 最终命中统计 ==="
          ccache -s

      # ----------------------------------------------------
      # Ccache 保存步骤 (使用 if: always() 确保无论成功失败都保存)
      # ----------------------------------------------------
      - name: Save Ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /home/runner/.cache/ccache
          key: ccache-Linux-lineage18-${{ github.run_id }}

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LineageOS-18.1-star2qltechn
          path: |
            /home/runner/lineage/out/target/product/star2qltechn/lineage-*.zip
            /home/runner/lineage/out/target/product/star2qltechn/boot.img
            /home/runner/lineage/out/target/product/star2qltechn/recovery.img
          retention-days: 7
